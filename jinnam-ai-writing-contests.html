<!doctype html>
<html lang="ko">
<head>
  <title>진남 AI글쓰기 대회 모아보기</title>
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans KR", system-ui, sans-serif;
      color: #1f2937;
      background: linear-gradient(135deg, #f5f3ff 0%, #eff6ff 48%, #fff7ed 100%);
      min-height: 100vh;
    }
    a { color: inherit; }
    .page { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 48px; }
    .contest-nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-bottom: 16px; }
    .contest-link {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 0 15px;
      border-radius: 999px;
      border: 1px solid rgba(124, 58, 237, .18);
      background: rgba(255,255,255,.8);
      color: #4b5563;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(31, 41, 55, .06);
    }
    .contest-link.active { color: white; border-color: transparent; background: linear-gradient(135deg, #7c3aed, #2563eb); }
    .hero {
      border-radius: 24px;
      padding: clamp(28px, 5vw, 54px);
      color: white;
      background: linear-gradient(135deg, #9333ea 0%, #4f46e5 52%, #2563eb 100%);
      box-shadow: 0 22px 60px rgba(67, 56, 202, .28);
    }
    .eyebrow {
      display: inline-flex;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.24);
      font-weight: 800;
      font-size: 14px;
    }
    h1 {
      margin: 18px 0 10px;
      font-family: "Noto Serif KR", serif;
      font-size: clamp(34px, 7vw, 62px);
      line-height: 1.1;
      letter-spacing: 0;
    }
    .hero p { max-width: 720px; margin: 0; color: rgba(255,255,255,.86); font-size: 18px; line-height: 1.7; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
    .card {
      display: flex;
      flex-direction: column;
      min-height: 260px;
      padding: 26px;
      border-radius: 22px;
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(255,255,255,.8);
      box-shadow: 0 16px 44px rgba(31, 41, 55, .08);
      text-decoration: none;
    }
    .card strong { font-family: "Noto Serif KR", serif; font-size: 32px; letter-spacing: 0; }
    .card p { color: #6b7280; line-height: 1.7; margin: 12px 0 0; }
    .card .button {
      margin-top: auto;
      display: inline-flex;
      width: fit-content;
      min-height: 42px;
      align-items: center;
      padding: 0 16px;
      border-radius: 999px;
      color: white;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      font-weight: 800;
    }
    .frame-wrap {
      margin-top: 20px;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.82);
      background: white;
      box-shadow: 0 16px 44px rgba(31, 41, 55, .08);
      height: calc(100vh - 280px);
      min-height: 540px;
    }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: white; }
    @media (max-width: 720px) {
      .page { width: min(100% - 20px, 1120px); padding-top: 10px; }
      .hero { border-radius: 18px; padding: 26px 20px; }
      .grid { grid-template-columns: 1fr; }
      .frame-wrap { height: 70vh; min-height: 480px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <nav class="contest-nav" aria-label="대회 선택">
      <a class="contest-link active" href="jinnam-ai-writing-contests.html">전체</a>
      <a class="contest-link" href="jinnam-ai-writing-contest-1.html">제 1회 대회</a>
      <a class="contest-link" href="jinnam-ai-writing-result.html">제 2회 대회</a>
    </nav>
    <section class="hero">
      <span class="eyebrow">진남초등학교 AI글쓰기 대회</span>
      <h1>대회별 결과 모아보기</h1>
      <p>제 1회와 제 2회 대회를 별도 화면으로 나누어 볼 수 있습니다.</p>
    </section>
    <section class="grid" aria-label="대회 목록">
      <a class="card" href="jinnam-ai-writing-contest-1.html">
        <strong>제 1회 대회</strong>
        <p>기존에 공개된 제 1회 진남 AI글쓰기 대회 결과 페이지를 같은 창에서 확인합니다.</p>
        <span class="button">1회 보기</span>
      </a>
      <a class="card" href="jinnam-ai-writing-result.html">
        <strong>제 2회 대회</strong>
        <p>4, 5, 6학년 학생 작품 28편과 평가 결과 영역을 확인합니다.</p>
        <span class="button">2회 보기</span>
      </a>
    </section>
  </main>
</body>
</html>
